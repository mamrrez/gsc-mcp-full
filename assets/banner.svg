      <rect x="784" y="76" width="28" height="28" rx="8" fill="#22c1a6"/>
      <text x="798" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">ک</text>
      <rect x="818" y="76" width="28" height="28" rx="8" fill="#f59e0b"/>
      <text x="832" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">あ</text>
      <rect x="852" y="76" width="28" height="28" rx="8" fill="#7c6cf5"/>
