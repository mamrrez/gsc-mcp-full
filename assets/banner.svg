<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d">
  <title id="t">Google Search Console MCP Server — gsc-mcp-full</title>
  <desc id="d">Search analytics, indexing, sitemaps and hourly data, with history beyond 16 months and correct numbers in every language. Works with Claude, ChatGPT Codex, Cursor, VS Code and Windsurf.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#13233f"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8ff7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f8ff7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ff7"/>
      <stop offset="0.55" stop-color="#7c6cf5"/>
      <stop offset="1" stop-color="#f25f7a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="480" rx="18" fill="url(#bg)"/>

  <!-- one keyword, typed in many scripts -->
