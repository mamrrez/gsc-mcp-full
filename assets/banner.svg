      <rect x="920" y="76" width="28" height="28" rx="8" fill="#f25f7a"/>
      <text x="934" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Я</text>
    <text x="966" y="95" font-size="15.5" fill="#b9c8e0">many spellings → one keyword</text>
  </g>

  <!-- performance: clicks and impressions -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <circle cx="706" cy="141" r="5" fill="#4f8ff7"/>
